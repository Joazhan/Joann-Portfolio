<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>He Loves Me...</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #FDF6EC;
      --petal: #FFFDF5;
      --petal-stroke: #E8D5B0;
      --center: #F5C842;
      --center-dark: #D4A017;
      --stem: #6BAF5E;
      --text: #5C3D2E;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--bg);
      font-family: 'Playfair Display', Georgia, serif;
      overflow: hidden;
    }

    #cam-feed {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      transform: scaleX(-1);
      opacity: 0;
      pointer-events: none;
      z-index: 0;
      display: none;
      transition: opacity 0.6s ease;
    }
    #cam-feed.active { opacity: 0.28; }

    #hand-canvas {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 1;
      display: none;
    }

    .scene {
      position: relative;
      z-index: 2;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      user-select: none;
    }

    #phrase-text {
      font-size: 1.65rem;
      font-style: italic;
      color: var(--text);
      letter-spacing: 0.01em;
      min-height: 2.4rem;
      text-align: center;
      transition: opacity 0.2s ease;
    }
    #phrase-text.flash { opacity: 0; }

    #daisy { display: block; overflow: visible; }

    .petal {
      cursor: default;
      transition: filter 0.15s ease;
    }
    .petal.hand-near {
      filter: brightness(1.04)
              drop-shadow(0 0 8px rgba(245, 200, 66, 0.9))
              drop-shadow(0 0 20px rgba(245, 200, 66, 0.5));
    }
    .petal.plucking {
      pointer-events: none;
    }

    #final-overlay {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 20px;
      background: rgba(253, 246, 236, 0.93);
      border-radius: 16px;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.4s ease;
    }
    #final-overlay.visible {
      opacity: 1;
      pointer-events: auto;
    }
    #final-text {
      font-size: 2rem;
      color: var(--text);
      text-align: center;
      animation: pop-in 0.5s cubic-bezier(0.34, 1.56, 0.64, 1) both;
    }
    #reset-btn {
      font-family: 'Playfair Display', Georgia, serif;
      font-size: 1rem;
      color: white;
      background: var(--center);
      border: none;
      border-radius: 9999px;
      padding: 10px 28px;
      cursor: pointer;
      transition: background 0.15s ease, transform 0.15s ease;
      animation: pop-in 0.5s 0.15s cubic-bezier(0.34, 1.56, 0.64, 1) both;
    }
    #reset-btn:hover {
      background: var(--center-dark);
      transform: scale(1.04);
    }

    /* Camera permission overlay */
    #cam-overlay {
      position: fixed;
      inset: 0;
      z-index: 10;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(253, 246, 236, 0.9);
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
      transition: opacity 0.4s ease;
    }
    #cam-overlay.gone {
      opacity: 0;
      pointer-events: none;
    }
    .overlay-card {
      background: #fff;
      border-radius: 20px;
      padding: 48px 44px;
      text-align: center;
      box-shadow: 0 8px 48px rgba(92, 61, 46, 0.13);
      max-width: 340px;
      width: 90%;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
    }
    .overlay-icon { font-size: 2.6rem; line-height: 1; margin-bottom: 4px; }
    .overlay-title {
      font-size: 1.35rem;
      color: var(--text);
      font-weight: 500;
    }
    .overlay-desc {
      font-size: 0.95rem;
      font-style: italic;
      color: rgba(92, 61, 46, 0.55);
      line-height: 1.5;
      margin-bottom: 8px;
    }
    #enable-cam-btn {
      font-family: 'Playfair Display', Georgia, serif;
      font-size: 1rem;
      color: white;
      background: var(--text);
      border: none;
      border-radius: 9999px;
      padding: 12px 32px;
      cursor: pointer;
      transition: background 0.15s ease, transform 0.15s ease;
    }
    #enable-cam-btn:hover:not(:disabled) {
      background: #3d2819;
      transform: scale(1.03);
    }
    #enable-cam-btn:disabled {
      opacity: 0.55;
      cursor: not-allowed;
    }
    #cam-status {
      font-size: 0.85rem;
      font-style: italic;
      color: rgba(92, 61, 46, 0.5);
      min-height: 1.3em;
    }
    #cam-error {
      font-size: 0.85rem;
      color: #b94040;
      font-style: italic;
      display: none;
    }

    /* Camera toggle */
    #cam-toggle {
      display: none;
      position: fixed;
      bottom: 20px;
      right: 20px;
      z-index: 5;
      width: 44px;
      height: 44px;
      font-size: 1.15rem;
      background: rgba(255, 255, 255, 0.82);
      border: 1.5px solid rgba(92, 61, 46, 0.14);
      border-radius: 50%;
      cursor: pointer;
      backdrop-filter: blur(4px);
      transition: background 0.15s, transform 0.15s;
    }
    #cam-toggle:hover { background: #fff; transform: scale(1.08); }

    /* Mobile gate */
    #mobile-msg {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 20;
      align-items: center;
      justify-content: center;
      background: var(--bg);
      padding: 40px;
    }
    #mobile-msg p {
      font-size: 1.1rem;
      font-style: italic;
      color: var(--text);
      text-align: center;
      line-height: 1.6;
    }
    @media (hover: none) and (pointer: coarse) {
      #mobile-msg  { display: flex; }
      #cam-overlay { display: none; }
    }

    @keyframes pop-in {
      from { transform: scale(0.75); opacity: 0; }
      to   { transform: scale(1);    opacity: 1; }
    }
  </style>
</head>
<body>

  <div id="mobile-msg">
    <p>This experience is designed<br>for desktop only 🌸</p>
  </div>

  <video id="cam-feed" autoplay playsinline muted></video>
  <canvas id="hand-canvas"></canvas>

  <div id="cam-overlay">
    <div class="overlay-card">
      <div class="overlay-icon">🌸</div>
      <p class="overlay-title">Pluck with your hands</p>
      <p class="overlay-desc">Hold your hand up and pinch a petal to pull it off</p>
      <button id="enable-cam-btn">Enable Camera</button>
      <p id="cam-status"></p>
      <p id="cam-error"></p>
    </div>
  </div>

  <button id="cam-toggle" title="Toggle camera feed">📷</button>

  <div class="scene">
    <p id="phrase-text">Pinch a petal...</p>

    <svg id="daisy" width="380" height="400" viewBox="-190 -220 380 420">
      <defs>
        <path id="petal-shape"
          d="M 0,0 C 22,-38 22,-100 0,-122 C -22,-100 -22,-38 0,0 Z" />
        <radialGradient id="center-grad" cx="42%" cy="38%" r="58%">
          <stop offset="0%"   stop-color="#FFE066" />
          <stop offset="100%" stop-color="#D4A017" />
        </radialGradient>
        <filter id="center-shadow" x="-30%" y="-30%" width="160%" height="160%">
          <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="rgba(92,61,46,0.2)" />
        </filter>
      </defs>

      <path d="M 0,38 C 4,80 -8,130 6,195"
        stroke="#6BAF5E" stroke-width="5" stroke-linecap="round" fill="none" />
      <ellipse cx="12"  cy="130" rx="22" ry="10" fill="#6BAF5E" transform="rotate(-30 12 130)" />
      <ellipse cx="-8"  cy="160" rx="20" ry="9"  fill="#6BAF5E" transform="rotate(25 -8 160)" />

      <circle id="daisy-center" r="38"
        fill="url(#center-grad)" filter="url(#center-shadow)" />
    </svg>

    <div id="final-overlay">
      <p id="final-text"></p>
      <button id="reset-btn">Try again ↺</button>
    </div>
  </div>

  <script type="module">
    import {
      HandLandmarker,
      FilesetResolver
    } from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/vision_bundle.mjs";

    // ── Constants ──────────────────────────────────────────────────────────────
    const PETAL_COUNT        = 13;
    const ANGLE_STEP         = 360 / PETAL_COUNT;
    const NEAR_THRESH_SVG    = 42;    // SVG units — must be over a specific petal
    const PINCH_CLOSE_NORM   = 0.08;  // normalized distance → pinch fires
    const PINCH_OPEN_NORM    = 0.12;  // normalized distance → pinch resets (hysteresis)
    const PLUCK_COOLDOWN_MS  = 400;   // ms before next pluck can fire
    const SMOOTH             = 0.55;  // EMA smoothing factor (0 = none, 1 = frozen)
    const svgNS              = 'http://www.w3.org/2000/svg';
    const PHRASES            = ['He loves me...', 'He loves me not...'];

    // ── DOM refs ───────────────────────────────────────────────────────────────
    const daisy      = document.getElementById('daisy');
    const daisyCenter = document.getElementById('daisy-center');
    const phraseEl   = document.getElementById('phrase-text');
    const finalOvl   = document.getElementById('final-overlay');
    const finalText  = document.getElementById('final-text');
    const resetBtn   = document.getElementById('reset-btn');
    const camFeed    = document.getElementById('cam-feed');
    const handCanvas = document.getElementById('hand-canvas');
    const ctx        = handCanvas.getContext('2d');
    const camOverlay = document.getElementById('cam-overlay');
    const camStatus  = document.getElementById('cam-status');
    const camError   = document.getElementById('cam-error');
    const enableBtn  = document.getElementById('enable-cam-btn');
    const camToggle  = document.getElementById('cam-toggle');

    // ── Game state ─────────────────────────────────────────────────────────────
    const STATE = { remaining: PETAL_COUNT, pluckCount: 0, finished: false };

    // ── Camera/tracking state ──────────────────────────────────────────────────
    let handLandmarker   = null;
    let cameraRunning    = false;
    let camVisible       = true;
    let pinchActive      = false;
    let lastVideoTime    = -1;
    let lastPluckTime    = 0;
    let lastProbeW       = null;
    let smoothedLms      = null;
    let grabbedPetal     = null;   // petal currently held
    let grabOffsetX      = 0;      // SVG offset from pinch midpoint to petal center at grab moment
    let grabOffsetY      = 0;
    let grabCurrentX     = 0;      // petal center position this frame (for fall start)
    let grabCurrentY     = 0;

    // ── Hand connections ───────────────────────────────────────────────────────
    const CONNECTIONS = [
      [0,1],[1,2],[2,3],[3,4],
      [0,5],[5,6],[6,7],[7,8],
      [0,9],[9,10],[10,11],[11,12],
      [0,13],[13,14],[14,15],[15,16],
      [0,17],[17,18],[18,19],[19,20],
      [5,9],[9,13],[13,17],
    ];

    // ── Daisy setup ────────────────────────────────────────────────────────────
    function createPetals() {
      for (let i = 0; i < PETAL_COUNT; i++) {
        const angle = i * ANGLE_STEP;
        const theta = (angle * Math.PI) / 180;
        const use   = document.createElementNS(svgNS, 'use');
        use.setAttributeNS('http://www.w3.org/1999/xlink', 'href', '#petal-shape');
        use.setAttribute('transform', `rotate(${angle}) translate(0, -72)`);
        use.setAttribute('fill',         'var(--petal)');
        use.setAttribute('stroke',       'var(--petal-stroke)');
        use.setAttribute('stroke-width', '1');
        use.dataset.angle = angle;
        use.dataset.cx    = (133 * Math.sin(theta)).toFixed(3);
        use.dataset.cy    = (-133 * Math.cos(theta)).toFixed(3);
        use.classList.add('petal');
        daisy.insertBefore(use, daisyCenter);
      }
    }

    function triggerFall(petal, startX, startY) {
      petal.classList.remove('hand-near');
      petal.classList.add('plucking');

      const angle   = parseFloat(petal.dataset.angle);
      const driftX  = startX + (Math.random() * 80 - 40);
      const spinEnd = angle + (Math.random() * 120 - 60);
      const FRAMES  = 48;
      let frame = 0;

      (function animate() {
        frame++;
        const t    = Math.min(frame / FRAMES, 1);
        const x    = startX + (driftX - startX) * t;
        const y    = startY + (260 - startY) * (t * t);
        const rot  = angle  + (spinEnd - angle) * t;
        petal.setAttribute('transform', `translate(${x.toFixed(1)},${y.toFixed(1)}) rotate(${rot.toFixed(1)})`);
        petal.style.opacity = Math.max(0, 1 - Math.max(0, t - 0.15) / 0.85);
        if (frame < FRAMES) requestAnimationFrame(animate);
        else petal.style.visibility = 'hidden';
      })();

      STATE.pluckCount++;
      STATE.remaining--;
      const phrase = PHRASES[(STATE.pluckCount - 1) % 2];
      phraseEl.classList.add('flash');
      setTimeout(() => { phraseEl.textContent = phrase; phraseEl.classList.remove('flash'); }, 150);

      if (STATE.remaining === 0) {
        STATE.finished = true;
        setTimeout(() => {
          const last = PHRASES[(STATE.pluckCount - 1) % 2];
          finalText.textContent = last === 'He loves me...' ? 'He loves me! 🌸' : 'He loves me not... 🍂';
          finalOvl.classList.add('visible');
        }, 800);
      }
    }

    function resetGame() {
      STATE.remaining  = PETAL_COUNT;
      STATE.pluckCount = 0;
      STATE.finished   = false;
      pinchActive      = false;
      lastPluckTime    = 0;
      grabbedPetal     = null;

      document.querySelectorAll('.petal').forEach(p => {
        p.classList.remove('plucking', 'hand-near');
        const angle = parseFloat(p.dataset.angle);
        p.setAttribute('transform', `rotate(${angle}) translate(0, -72)`);
        p.style.opacity    = '';
        p.style.visibility = '';
      });

      phraseEl.textContent = 'Pinch a petal...';
      finalOvl.classList.remove('visible');
    }

    resetBtn.addEventListener('click', resetGame);

    // ── Landmark smoothing ─────────────────────────────────────────────────────
    function applySmoothing(rawLandmarks) {
      if (!rawLandmarks || !rawLandmarks.length) {
        smoothedLms = null;
        return null;
      }
      const raw = rawLandmarks[0];
      if (!smoothedLms || smoothedLms.length !== raw.length) {
        smoothedLms = raw.map(lm => ({ x: lm.x, y: lm.y, z: lm.z }));
      } else {
        for (let i = 0; i < raw.length; i++) {
          smoothedLms[i].x = smoothedLms[i].x * SMOOTH + raw[i].x * (1 - SMOOTH);
          smoothedLms[i].y = smoothedLms[i].y * SMOOTH + raw[i].y * (1 - SMOOTH);
          smoothedLms[i].z = smoothedLms[i].z * SMOOTH + raw[i].z * (1 - SMOOTH);
        }
      }
      return [smoothedLms];
    }

    // ── Coordinate mapping ─────────────────────────────────────────────────────
    function landmarkToWindow(lm) {
      const vw = window.innerWidth;
      const vh = window.innerHeight;
      const va = camFeed.videoWidth / (camFeed.videoHeight || 1);
      const wa = vw / vh;

      let scaleX, scaleY, offX, offY;
      if (va > wa) {
        scaleY = vh;
        scaleX = vh * va;
        offX   = -(scaleX - vw) / 2;
        offY   = 0;
      } else {
        scaleX = vw;
        scaleY = vw / va;
        offX   = 0;
        offY   = -(scaleY - vh) / 2;
      }

      return {
        x: (1 - lm.x) * scaleX + offX,
        y: lm.y        * scaleY + offY,
      };
    }

    function windowToSVG(wx, wy) {
      const ctm = daisy.getScreenCTM();
      if (!ctm) return null;
      const pt = daisy.createSVGPoint();
      pt.x = wx; pt.y = wy;
      return pt.matrixTransform(ctm.inverse());
    }

    // ── Hand tracking ──────────────────────────────────────────────────────────
    function processHands(landmarks) {
      document.querySelectorAll('.petal.hand-near').forEach(p => p.classList.remove('hand-near'));

      if (!landmarks || !landmarks.length) {
        if (grabbedPetal) { releasePetal(); }
        pinchActive = false;
        return;
      }

      const lms        = landmarks[0];
      const pinchNorm  = Math.hypot(lms[4].x - lms[8].x, lms[4].y - lms[8].y);
      const isPinching = pinchNorm < PINCH_CLOSE_NORM;

      const thumbW = landmarkToWindow(lms[4]);
      const indexW = landmarkToWindow(lms[8]);
      const midW   = { x: (thumbW.x + indexW.x) / 2, y: (thumbW.y + indexW.y) / 2 };
      lastProbeW   = midW;

      const midSVG = windowToSVG(midW.x, midW.y);
      if (!midSVG) return;

      if (isPinching) {
        if (!pinchActive) {
          // Pinch just closed — try to grab a petal
          pinchActive = true;
          if (!grabbedPetal && !STATE.finished && Date.now() - lastPluckTime > PLUCK_COOLDOWN_MS) {
            let closest = null, closestD = Infinity;
            document.querySelectorAll('.petal:not(.plucking)').forEach(p => {
              const d = Math.hypot(midSVG.x - parseFloat(p.dataset.cx), midSVG.y - parseFloat(p.dataset.cy));
              if (d < closestD) { closestD = d; closest = p; }
            });
            if (closest && closestD < NEAR_THRESH_SVG) {
              grabbedPetal = closest;
              // Record offset so petal stays at exact grab point relative to hand
              grabOffsetX  = parseFloat(closest.dataset.cx) - midSVG.x;
              grabOffsetY  = parseFloat(closest.dataset.cy) - midSVG.y;
              grabCurrentX = parseFloat(closest.dataset.cx);
              grabCurrentY = parseFloat(closest.dataset.cy);
            }
          }
        }

        if (grabbedPetal) {
          // Petal follows pinch midpoint, preserving grab offset
          grabCurrentX = midSVG.x + grabOffsetX;
          grabCurrentY = midSVG.y + grabOffsetY;
          const angle  = parseFloat(grabbedPetal.dataset.angle);
          const theta  = angle * Math.PI / 180;
          // Place petal so its visual center sits at (grabCurrentX, grabCurrentY)
          const tx = grabCurrentX - 61 * Math.sin(theta);
          const ty = grabCurrentY + 61 * Math.cos(theta);
          grabbedPetal.setAttribute('transform', `translate(${tx.toFixed(2)},${ty.toFixed(2)}) rotate(${angle})`);
          grabbedPetal.classList.add('hand-near');
        }

      } else {
        // Pinch opened
        if (pinchActive && grabbedPetal) {
          releasePetal();
        }
        if (pinchNorm > PINCH_OPEN_NORM) pinchActive = false;

        // Hover glow when no petal grabbed
        document.querySelectorAll('.petal:not(.plucking)').forEach(p => {
          const d = Math.hypot(midSVG.x - parseFloat(p.dataset.cx), midSVG.y - parseFloat(p.dataset.cy));
          if (d < NEAR_THRESH_SVG) p.classList.add('hand-near');
        });
      }
    }

    function releasePetal() {
      const petal = grabbedPetal;
      const sx    = grabCurrentX;
      const sy    = grabCurrentY;
      grabbedPetal = null;
      lastPluckTime = Date.now();
      triggerFall(petal, sx, sy);
    }

    function drawSkeleton(landmarks) {
      if (!landmarks || !landmarks.length) return;

      const lms  = landmarks[0];
      const pts  = lms.map(landmarkToWindow);
      const t    = pts[4]; // thumb tip
      const idx  = pts[8]; // index tip

      // Normalized pinch distance (same as processHands uses)
      const pinchNorm = Math.hypot(lms[4].x - lms[8].x, lms[4].y - lms[8].y);
      const isPinching = pinchNorm < PINCH_CLOSE_NORM;

      // How far through the pinch gesture (0 = fully open, 1 = fully pinched)
      const pinchProgress = Math.max(0, Math.min(1,
        (PINCH_OPEN_NORM - pinchNorm) / (PINCH_OPEN_NORM - PINCH_CLOSE_NORM)
      ));

      // Connections
      ctx.strokeStyle = `rgba(245, 200, 66, ${0.3 + pinchProgress * 0.35})`;
      ctx.lineWidth   = 1.5;
      CONNECTIONS.forEach(([a, b]) => {
        ctx.beginPath();
        ctx.moveTo(pts[a].x, pts[a].y);
        ctx.lineTo(pts[b].x, pts[b].y);
        ctx.stroke();
      });

      // All landmark dots
      pts.forEach(p => {
        ctx.beginPath();
        ctx.arc(p.x, p.y, 3.5, 0, Math.PI * 2);
        ctx.fillStyle = `rgba(245, 200, 66, ${0.45 + pinchProgress * 0.3})`;
        ctx.fill();
      });

      // Thumb + index tips (larger)
      [t, idx].forEach(p => {
        ctx.beginPath();
        ctx.arc(p.x, p.y, 6.5, 0, Math.PI * 2);
        ctx.fillStyle   = 'rgba(245, 200, 66, 0.95)';
        ctx.fill();
        ctx.strokeStyle = 'rgba(255,255,255,0.85)';
        ctx.lineWidth   = 1.5;
        ctx.stroke();
      });

      // Pinch progress ring at midpoint — grows brighter as fingers close
      if (pinchProgress > 0.05) {
        const mx = (t.x + idx.x) / 2;
        const my = (t.y + idx.y) / 2;
        const radius = 18 - pinchProgress * 6; // shrinks as pinch tightens

        // Filled arc showing progress
        ctx.beginPath();
        ctx.arc(mx, my, radius, -Math.PI / 2, -Math.PI / 2 + pinchProgress * Math.PI * 2);
        ctx.strokeStyle = `rgba(245, 200, 66, ${0.5 + pinchProgress * 0.5})`;
        ctx.lineWidth   = 3;
        ctx.stroke();

        // Background ring
        ctx.beginPath();
        ctx.arc(mx, my, radius, 0, Math.PI * 2);
        ctx.strokeStyle = 'rgba(245, 200, 66, 0.2)';
        ctx.lineWidth   = 1.5;
        ctx.stroke();

        if (isPinching) {
          ctx.beginPath();
          ctx.arc(mx, my, radius, 0, Math.PI * 2);
          ctx.fillStyle = 'rgba(245, 200, 66, 0.22)';
          ctx.fill();
        }
      }

    }

    function detectionLoop() {
      if (!cameraRunning) return;

      handCanvas.width  = window.innerWidth;
      handCanvas.height = window.innerHeight;
      ctx.clearRect(0, 0, handCanvas.width, handCanvas.height);

      if (camFeed.readyState >= 2 && camFeed.currentTime !== lastVideoTime) {
        lastVideoTime = camFeed.currentTime;
        const results  = handLandmarker.detectForVideo(camFeed, performance.now());
        const smoothed = applySmoothing(results.landmarks);
        drawSkeleton(smoothed);
        processHands(smoothed);
      }

      requestAnimationFrame(detectionLoop);
    }

    // ── MediaPipe + camera init ────────────────────────────────────────────────
    async function initMediaPipe() {
      camStatus.textContent = 'Loading model...';
      const vision = await FilesetResolver.forVisionTasks(
        'https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm'
      );
      handLandmarker = await HandLandmarker.createFromOptions(vision, {
        baseOptions: {
          modelAssetPath: 'https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task',
          delegate: 'GPU',
        },
        runningMode: 'VIDEO',
        numHands: 1,
      });
    }

    enableBtn.addEventListener('click', async () => {
      enableBtn.disabled = true;
      camError.style.display = 'none';

      try {
        if (!navigator.mediaDevices?.getUserMedia) {
          throw Object.assign(new Error(
            'Camera not available here — open this file directly in your browser (not inside an embedded frame).'
          ), { name: 'NotSupportedError' });
        }

        camStatus.textContent = 'Requesting camera...';
        const stream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: 'user', width: { ideal: 1280 }, height: { ideal: 720 } },
        });
        camFeed.srcObject = stream;
        await new Promise(res => camFeed.addEventListener('loadeddata', res, { once: true }));

        await initMediaPipe();

        camStatus.textContent = '';
        camFeed.style.display = 'block';
        handCanvas.style.display = 'block';
        camToggle.style.display  = 'flex';
        camOverlay.classList.add('gone');
        setTimeout(() => { camFeed.classList.add('active'); }, 50);

        cameraRunning = true;
        requestAnimationFrame(detectionLoop);
      } catch (err) {
        enableBtn.disabled = false;
        camStatus.textContent = '';
        camError.textContent = err.name === 'NotAllowedError'
          ? 'Camera access denied — please allow camera and try again.'
          : `Couldn't start: ${err.message}`;
        camError.style.display = 'block';
      }
    });

    camToggle.addEventListener('click', () => {
      camVisible = !camVisible;
      camFeed.style.opacity = camVisible ? '' : '0';
      camToggle.textContent = camVisible ? '📷' : '🚫';
    });

    // ── Init ───────────────────────────────────────────────────────────────────
    createPetals();
  </script>
</body>
</html>
